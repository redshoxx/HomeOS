name: HomeOS CI & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - altstore-source.json
      - package-lock.json
      - README.md
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homeos-release
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  CI: 1
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  quality:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi
      - run: npm run prepare:assets
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: HomeOS-package-lock
          path: package-lock.json
          retention-days: 2

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi
      - run: npm run prepare:assets
      - name: Set native build number
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const build = Number(process.env.GITHUB_RUN_NUMBER);
          app.expo.ios.buildNumber = String(build);
          app.expo.android.versionCode = build;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
      - run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --build-cache --parallel --daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk HomeOS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeOS-Android-APK
          path: HomeOS.apk
          retention-days: 14
          compression-level: 0

  ios:
    name: iOS IPA for AltStore
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi
      - run: npm run prepare:assets
      - name: Set native build number
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const build = Number(process.env.GITHUB_RUN_NUMBER);
          app.expo.ios.buildNumber = String(build);
          app.expo.android.versionCode = build;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
      - run: npx expo prebuild --platform ios --no-install
      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json', 'package.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - run: cd ios && pod install
      - name: Build physical iPhone app
        shell: bash
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(find ios -path "*/xcshareddata/xcschemes/*.xcscheme" -not -path "*/Pods/*" | head -1 | sed 's#.*/##; s#\.xcscheme$##')
          test -n "$WORKSPACE"
          test -n "$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/ios/build" \
            -parallelizeTargets \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
      - name: Create IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP_PATH"
          rm -rf Payload HomeOS.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/HomeOS.app
          zip -qry HomeOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HomeOS-iOS-IPA
          path: HomeOS.ipa
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish AltStore update
    needs: [quality, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: HomeOS-Android-APK
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: HomeOS-iOS-IPA
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: HomeOS-package-lock
          path: release-lock
      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          cp release-lock/package-lock.json package-lock.json
          node scripts/prepare-assets.js
          cp assets/icon.png release/HomeOS-icon.png

          VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          BUILD_VERSION="$GITHUB_RUN_NUMBER"
          RELEASE_TAG="build-$GITHUB_RUN_NUMBER"
          IPA_SIZE="$(stat -c%s release/HomeOS.ipa)"
          IPA_SHA256="$(sha256sum release/HomeOS.ipa | awk '{print $1}')"

          {
            printf 'VERSION=%s\n' "$VERSION"
            printf 'BUILD_VERSION=%s\n' "$BUILD_VERSION"
            printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG"
            printf 'IPA_SIZE=%s\n' "$IPA_SIZE"
            printf 'IPA_SHA256=%s\n' "$IPA_SHA256"
          } >> "$GITHUB_ENV"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/HomeOS.ipa release/HomeOS.apk release/HomeOS-icon.png \
            --title "HomeOS $VERSION ($BUILD_VERSION)" \
            --notes "HomeOS $VERSION: komplett vereinfachte Oberfläche, zentraler Schnell-Hinzufügen-Flow, schnellere Listen und optimierte Build-Pipeline." \
            --latest
      - name: Update AltStore source
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          version = os.environ['VERSION']
          build = os.environ['BUILD_VERSION']
          tag = os.environ['RELEASE_TAG']
          size = int(os.environ['IPA_SIZE'])
          sha = os.environ['IPA_SHA256']
          base = f"https://github.com/redshoxx/HomeOS/releases/download/{tag}"
          path = Path('altstore-source.json')
          old_versions = []
          if path.exists():
              try:
                  previous = json.loads(path.read_text(encoding='utf-8'))
                  old_versions = previous.get('apps', [{}])[0].get('versions', [])
              except Exception:
                  pass
          new_version = {
              'version': version,
              'buildVersion': build,
              'date': datetime.now(timezone.utc).date().isoformat(),
              'localizedDescription': 'Neue vereinfachte HomeOS Oberfläche, schnelleres Hinzufügen, optimierte Performance und stabilere Abläufe.',
              'downloadURL': f'{base}/HomeOS.ipa',
              'size': size,
              'sha256': sha,
          }
          versions = [new_version] + [v for v in old_versions if str(v.get('buildVersion')) != build][:9]
          source = {
              'name': 'HomeOS',
              'subtitle': 'Private Haushalts-App für Einkauf, Zuhause und Finanzen.',
              'description': 'Offizielle HomeOS AltStore Source.',
              'tintColor': '#163C2A',
              'apps': [{
                  'name': 'HomeOS',
                  'bundleIdentifier': 'at.homeos.mobile',
                  'developerName': 'redshoxx',
                  'subtitle': 'Dein Haushalt. Einfach organisiert.',
                  'localizedDescription': 'HomeOS bündelt Einkauf, Aufgaben, Vorräte, Finanzen, Rechnungen und Geräte in einer einfachen Oberfläche.',
                  'iconURL': f'{base}/HomeOS-icon.png',
                  'tintColor': '#163C2A',
                  'category': 'utilities',
                  'versions': versions,
                  'appPermissions': {'entitlements': [], 'privacy': {}},
              }],
              'news': [],
          }
          path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish AltStore source JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore-source.json package-lock.json
          git commit -m "chore: publish AltStore build $BUILD_VERSION [skip ci]" || exit 0
          git push origin HEAD:main
