name: HomeOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo prebuild --platform android --non-interactive
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk HomeOS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeOS-Android-APK
          path: HomeOS.apk
          retention-days: 30

  ios:
    name: iOS IPA für Sideloadly
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npx expo prebuild --platform ios --non-interactive
      - run: cd ios && pod install
      - name: Build iPhone app
        shell: bash
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(find ios -path "*/xcshareddata/xcschemes/*.xcscheme" -not -path "*/Pods/*" | head -1 | sed 's#.*/##; s#\.xcscheme$##')
          test -n "$WORKSPACE"
          test -n "$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$PWD/ios/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Create IPA
        shell: bash
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP_PATH"
          rm -rf Payload HomeOS-Sideloadly.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/HomeOS.app
          zip -qry HomeOS-Sideloadly.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HomeOS-iOS-Sideloadly-IPA
          path: HomeOS-Sideloadly.ipa
          retention-days: 30
