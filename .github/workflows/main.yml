name: HomeOS CI & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - altstore-source.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homeos-release
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  CI: 1

jobs:
  quality:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run prepare:assets
      - run: npm run typecheck
      - run: npm test

  android:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run prepare:assets
      - name: Set native build number
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const build = Number(process.env.GITHUB_RUN_NUMBER);
          app.expo.ios.buildNumber = String(build);
          app.expo.android.versionCode = build;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
      - run: npx expo prebuild --platform android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk HomeOS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeOS-Android-APK
          path: HomeOS.apk
          retention-days: 30

  ios:
    name: iOS IPA for AltStore
    needs: quality
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run prepare:assets
      - name: Set native build number
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const build = Number(process.env.GITHUB_RUN_NUMBER);
          app.expo.ios.buildNumber = String(build);
          app.expo.android.versionCode = build;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
      - run: npx expo prebuild --platform ios
      - run: cd ios && pod install
      - name: Build physical iPhone app
        shell: bash
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(find ios -path "*/xcshareddata/xcschemes/*.xcscheme" -not -path "*/Pods/*" | head -1 | sed 's#.*/##; s#\.xcscheme$##')
          test -n "$WORKSPACE"
          test -n "$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$PWD/ios/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Create IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP_PATH"
          rm -rf Payload HomeOS.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/HomeOS.app
          zip -qry HomeOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HomeOS-iOS-IPA
          path: HomeOS.ipa
          retention-days: 30

  publish:
    name: Publish AltStore update
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: HomeOS-Android-APK
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: HomeOS-iOS-IPA
          path: release
      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-assets.js
          cp assets/icon.png release/HomeOS-icon.png

          VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          BUILD_VERSION="$GITHUB_RUN_NUMBER"
          RELEASE_TAG="build-$GITHUB_RUN_NUMBER"
          IPA_SIZE="$(stat -c%s release/HomeOS.ipa)"
          IPA_SHA256="$(sha256sum release/HomeOS.ipa | awk '{print $1}')"

          {
            printf 'VERSION=%s\n' "$VERSION"
            printf 'BUILD_VERSION=%s\n' "$BUILD_VERSION"
            printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG"
            printf 'IPA_SIZE=%s\n' "$IPA_SIZE"
            printf 'IPA_SHA256=%s\n' "$IPA_SHA256"
          } >> "$GITHUB_ENV"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/HomeOS.ipa release/HomeOS.apk release/HomeOS-icon.png --title "HomeOS $VERSION ($BUILD_VERSION)" --notes "HomeOS $VERSION build $BUILD_VERSION: redesigned interface, stability fixes, cloud sync improvements and AltStore update support." --latest
      - name: Update AltStore source
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          version = os.environ['VERSION']
          build = os.environ['BUILD_VERSION']
          tag = os.environ['RELEASE_TAG']
          size = int(os.environ['IPA_SIZE'])
          sha = os.environ['IPA_SHA256']
          base = f"https://github.com/redshoxx/HomeOS/releases/download/{tag}"
          path = Path('altstore-source.json')
          old_versions = []
          if path.exists():
              try:
                  previous = json.loads(path.read_text(encoding='utf-8'))
                  old_versions = previous.get('apps', [{}])[0].get('versions', [])
              except Exception:
                  pass
          new_version = {
              'version': version,
              'buildVersion': build,
              'date': datetime.now(timezone.utc).date().isoformat(),
              'localizedDescription': 'Neues HomeOS Design, Stabilitätsverbesserungen, Cloud-Sync und AltStore-Update-Kanal.',
              'downloadURL': f'{base}/HomeOS.ipa',
              'size': size,
              'sha256': sha,
          }
          versions = [new_version] + [v for v in old_versions if str(v.get('buildVersion')) != build][:9]
          source = {
              'name': 'HomeOS',
              'subtitle': 'Private Haushalts-App für Einkauf, Zuhause und Finanzen.',
              'description': 'Offizielle HomeOS AltStore Source.',
              'tintColor': '#163C2A',
              'apps': [{
                  'name': 'HomeOS',
                  'bundleIdentifier': 'at.homeos.mobile',
                  'developerName': 'redshoxx',
                  'subtitle': 'Dein Haushalt. Einfach organisiert.',
                  'localizedDescription': 'HomeOS organisiert Einkauf, Vorräte, Aufgaben, Finanzen, Rechnungen und Geräte offline-first mit optionalem Cloud-Sync.',
                  'iconURL': f'{base}/HomeOS-icon.png',
                  'tintColor': '#163C2A',
                  'category': 'utilities',
                  'versions': versions,
                  'appPermissions': {'entitlements': [], 'privacy': {}},
              }],
              'news': [],
          }
          path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish AltStore source JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore-source.json
          git commit -m "chore: publish AltStore build $BUILD_VERSION [skip ci]" || exit 0
          git push origin HEAD:main
